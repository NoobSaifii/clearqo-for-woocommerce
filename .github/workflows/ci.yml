name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  checks:
    name: Versions, text domain, JS & zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: node --check assets/blocks.js
      - name: Version numbers match everywhere
        run: |
          header=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' clearqo-for-woocommerce.php)
          constant=$(grep -m1 -oP "define\( 'CLQWC_VERSION', '\K[0-9.]+" clearqo-for-woocommerce.php)
          stable=$(grep -m1 -oP '^Stable tag:\s*\K[0-9.]+' readme.txt)
          echo "header=$header constant=$constant stable=$stable"
          test -n "$header" && test "$header" = "$constant" && test "$header" = "$stable"
          grep -q "^= $header =" readme.txt
          grep -q "^## \[$header\]" CHANGELOG.md
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "${GITHUB_REF#refs/tags/v}" = "$header"; fi
      - name: Every translatable string uses the plugin text domain
        run: |
          if grep -nP "\b(__|_e|_x|_n|esc_html__|esc_html_e|esc_attr__|esc_attr_e)\(" clearqo-for-woocommerce.php | grep -v "'clearqo-for-woocommerce'"; then
            echo "::error::Translatable string without the clearqo-for-woocommerce text domain"; exit 1
          fi
      - name: Build the plugin zip (development files excluded)
        run: |
          git archive --format=zip --prefix=clearqo-for-woocommerce/ -o clearqo-for-woocommerce.zip HEAD
          unzip -l clearqo-for-woocommerce.zip
          if unzip -l clearqo-for-woocommerce.zip | grep -E '\.github|\.git|README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|docs/'; then
            echo "::error::Development files leaked into the plugin zip"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: clearqo-for-woocommerce
          path: clearqo-for-woocommerce.zip

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Export the plugin exactly as it is shipped
        run: |
          mkdir -p build
          git archive --format=tar --prefix=clearqo-for-woocommerce/ HEAD | tar -x -C build
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./build/clearqo-for-woocommerce
