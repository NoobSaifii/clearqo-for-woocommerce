name: Feature request
description: Suggest an idea for the plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "As a store owner I want … so that …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, screenshots, links.
